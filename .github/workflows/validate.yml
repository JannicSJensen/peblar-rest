name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/peblar_rest/manifest.json >/dev/null
          python -m json.tool custom_components/peblar_rest/strings.json >/dev/null
          python -m json.tool custom_components/peblar_rest/translations/en.json >/dev/null
